<!DOCTYPE html>
<head>
<title> Proste obliczenia</title>
<meta-charset="utf-8">
</head>
<body>
<div style="color:red; font-size:100px;">
<script language="JavaScript">
var liczba1=prompt("Podaj mianownik m=" ,");
var m_fok=parseFloat(liczba1);
document.write("1/"+m_fok+"=");
document.write("1/"(1+m_fok)+"+");
document.write("1/"+(m_fok*(1+m_fok))+"<br>");
</script>
</div>
</body>
</html>
